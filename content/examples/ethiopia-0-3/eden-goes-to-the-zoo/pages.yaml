framework: journey-call-response
house_style: docs/kokeba-writing-guidelines.md
layout: { left: "English story only", right: "illustration + Amharic vocab (fidel + transliteration)" }
style: { rhyme: true, scheme: "AABB couplets", amharic_in_rhyme: false }
spreads:
  - n: cover  left: "Eden Goes to the Zoo"
  - n: dedication  left: "For our little star"
  - n: 1  beat: wake    left: "Good morning, Eden, sleepyhead. / Time to wake and leave your bed."
  - n: 2  beat: journey left: "Shoes on feet, bow in hair. / Off to the zoo— we're almost there!"
  - n: 3  beat: animal  left: "A lion stands strong and proud. / \"ROAR!\" says Eden, big and loud."  interaction: "Can you roar?"  vocab: { am: "አንበሳ", translit: "Anbessa", en: lion }
  - n: 4  beat: animal  left: "An elephant stomps down the way. / His trunk waves high to say, \"Good day!\""  interaction: "Can you wave?"  vocab: { am: "ዝሆን", translit: "Zihon", en: elephant }
  - n: 5  beat: animal  left: "A monkey swings from tree to tree. / \"Ee-ee-ee!\" chatters he."  interaction: "Can you chatter too?"  vocab: { am: "ዝንጀሮ", translit: "Zinjero", en: monkey }
  - n: 6  beat: animal  left: "A giraffe stretches to the sky. / Its long neck reaches way up high."  interaction: "Can you stretch tall?"  vocab: { am: "ቀጭኔ", translit: "Qechne", en: giraffe }
  - n: 7  beat: animal  left: "A camel walks with bumpity bump. / Wiggle and giggle— look at that hump!"  interaction: "Can you bounce?"  vocab: { am: "ግመል", translit: "Gimel", en: camel }
  - n: 8  beat: animal  left: "A hippo splashes in the pool. / Splashing water is very cool!"  interaction: "Can you splash?"  vocab: { am: "ጉማሬ", translit: "Gumare", en: hippo }
  - n: 9  beat: animal  left: "A leopard tiptoes soft and slow. / Where is it going? Nobody knows."  interaction: "Can you tiptoe?"  vocab: { am: "ነብር", translit: "Nebir", en: leopard }
  - n: 10 beat: reflection  left: "We saw animals, big and small. / Eden's favorite? She loved them all!"
  - n: 11 beat: final  left: "The bus rolls home. The sky turns blue. / Eden waves, \"Bye-bye, zoo!\" / She smiles at Mommy and starts to say, / \"Can we come back another day?\""
  - n: end  left: "Kokeba ★ — A story for every little star."
