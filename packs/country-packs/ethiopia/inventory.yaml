# Ethiopia Country Pack — KNOWLEDGE INVENTORY
# A structured store of everything an author needs to write authentically for this market.
# The engine compiles this (+ prompt.md) into context for the story-writing agent.
# NOTE: AI-compiled; a native reviewer must verify every entry before publishing.
meta:
  country: Ethiopia
  primary_language: Amharic (am)
  script: Ge'ez / fidel
  also_spoken: [Afaan Oromo, Tigrinya, Somali, English]

identity_and_values:
  core_values: [family & elders, hospitality, community (sharing meals), faith, respect, resilience, pride in heritage]
  what_makes_proud: [never colonized, ancient script & church, Lucy/origins of humankind, unique 13-month calendar, coffee origin]
  family_structure: extended family central; grandparents revered; communal child-raising
  child_rearing: babies carried close, sung to, surrounded by relatives; storytelling oral tradition ("teret teret")

daily_life:
  home: [mesob (basket table), traditional + modern homes, coffee corner]
  routines: [morning coffee ceremony, shared meals from one plate, market days, church/mosque]
  sounds: [coffee roasting, church bells, call to prayer, lentil pot, children playing]

food_and_drink:
  staples: [injera (እንጀራ) flatbread, wot/stew, shiro (ሽሮ), teff (ጤፍ) grain]
  drink: [buna (ቡና) coffee — central ritual, tea/shai]
  treats: [honey/mar (ማር), dabo bread, popcorn at coffee]

nature_and_animals:
  animals: [fiyel/goat (ፍየል), doro/chicken (ዶሮ), bere/ox (በሬ), gimel/camel (ግመል), anbessa/lion (አንበሳ — national symbol), walia ibex, gelada]
  sky_nature: [tsehay/sun (ጸሐይ), chereka/moon (ጨረቃ), kokeb/star (ኮከብ), abeba/flower (አበባ), zinab/rain (ዝናብ)]
  landscapes: [highlands, Simien Mountains, Rift Valley, Blue Nile/Abay]

# ENVIRONMENT & SETTING — feeds the Illustration agent so backdrops read as ETHIOPIA, not a generic place.
# Use this for any outdoor/scenery prompt (zoo, market, home, journey). Native reviewer verifies.
environment_and_setting:
  climate:
    highlands: "Addis Ababa sits ~2,355 m — temperate highland, NOT hot tropical. Mild, sunny, blue skies
      ('13 months of sunshine'). Dry season most of the year; the big rains (kiremt) fall Jun–Sep."
    light: "clear high-altitude light, soft warm sun, long gentle shadows; crisp not hazy."
    lowlands_note: "Rift Valley / lowlands ARE hot and arid (acacia savanna) — use these for camel/heat scenes,
      not for an Addis highland scene."
  vegetation:
    everyday_urban: "eucalyptus is EVERYWHERE in Addis (tall, slender, blue-green, peeling bark — introduced by
      Emperor Menelik ~1894); jacaranda (purple blossom) lines some streets."
    native_highland: [Juniperus procera (tid — tall conifer), Olea europaea cuspidata (wild olive),
      Hagenia abyssinica (kosso), Acacia abyssinica (flat-topped acacia), Afrocarpus/Podocarpus (zigba)]
    savanna_lowland: [flat-topped acacia, euphorbia candelabra (tree-cactus shape), dry golden grass]
    signature_shade_tree: "warka / sycamore fig (ዋርካ) — big spreading shade tree, culturally beloved
      (community gathers under it). Great hero tree for a friendly outdoor scene."
    flowers: "adey abeba (yellow Meskel daisy) — the iconic Ethiopian wildflower, blooms spring/New Year."
    ground: "reddish-brown highland soil; tended grass + shrubs in parks."
  zoo_reference:
    real_place: "Ethiopia's zoo is the Addis Ababa Zoo — 'Anbessa Gibi' (አንበሳ ግቢ, 'lion compound'),
      founded 1948 by Emperor Haile Selassie."
    lion_detail: "IMPORTANT — Ethiopia's lions are the distinctive Abyssinian / 'black-maned' lion: a thick
      DARK mane running from the head down over the shoulders. Draw the storybook lion with a darker mane to
      make it proudly Ethiopian (still soft & friendly for 0–3)."
    enclosure_look: "simple highland-park enclosures: wood/stone rails, eucalyptus & acacia and a warka
      shade tree behind, reddish soil + green shrubs, blue highland sky. Soft and uncluttered for 0–3."
    barrier_safety: "Scale the barrier to the animal (see style guide 'Physical & safety realism'). The LION and
      LEOPARD sit/rest SET BACK on a raised rocky ledge with a CLEARLY VISIBLE WATER MOAT (a small river/channel of
      blue water) in the gap between the visitor rail and the ledge — this reads obviously as 'cannot reach / cannot
      cross', better than a vague gap. A sturdy rail/low stone wall on the visitor side too; never right beside the
      child over a knee-high rail. Hippo stays in its pool, set back. Gentle/tall animals (giraffe reaching down,
      monkey, camel, elephant trunk) may come nearer the rail."
  architecture_texture: "mix of traditional (round tukul with thatch in rural scenes) and simple modern;
    corrugated-metal roofs common; warm earth-tone walls. Keep backgrounds soft, not busy."
  avoid_setting_cliches: "do NOT default to flat hot savanna + safari acacia for an Addis scene; do NOT add
    snow, pine forests, or Western zoo architecture; no famine/dust imagery."

places_and_heritage:
  landmarks: [Lalibela rock churches, Axum, Gondar castles, Addis Ababa, Simien Mountains]
  history_for_kids: [ancient kingdoms, the fidel script, Lucy/Dinknesh, Queen of Sheba (gentle)]

holidays_and_traditions:
  holidays:
    - Enkutatash (አዲስ ዓመት) — New Year, Sept, yellow daisies (adey abeba)
    - Timket — Epiphany, processions, white robes
    - Meskel — finding of the cross, bonfire (demera)
    - Genna — Ethiopian Christmas
    - Eid al-Fitr / Eid al-Adha — for Muslim families
  calendar: 13 months; ~7-8 years behind Gregorian; New Year in September
  coffee_ceremony: roasting, three rounds, incense, popcorn — symbol of welcome

faith:
  traditions: [Ethiopian Orthodox Tewahedo, Islam, Protestant, Catholic, others]
  guidance: "Represent inclusively and gently; avoid doctrine; celebrate shared values (gratitude, kindness, family)."

language_texture:
  greetings: [selam/hello-peace (ሰላም), tena yistilign/hello-formal, dehna/well (ደህና), chaw/bye (ቻው)]
  endearments: [emaye/mommy (እማዬ), ababa/daddy (አባባ), lije/my child (ልጄ)]
  storytelling_opener: "Teret teret — the Ethiopian 'once upon a time'."
  naming: names carry meaning (Abeba=flower, Desta=joy, Kokeb=star, Selam=peace)

sensitivities:
  do: [show diverse skin tones & regions, honor elders, keep faith inclusive, accurate fidel]
  avoid: [stereotypes of poverty/famine, conflict/politics, one-ethnicity-only framing, sacred imagery as decoration]

reviewer:
  required: true
  checks: [fidel spelling, transliteration, dialect, cultural accuracy, faith sensitivity, originality]

# Sources: compiled by the Research agent from data-sources/registry.yaml (cited). Native reviewer verifies.
