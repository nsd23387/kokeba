<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kokeba Studio</title>
<style>
:root{--navy:#222B6D;--gold:#C9A227;--cream:#FBF7EC;--sage:#A7B59A;--ink:#222B6D;--muted:#6b6f86;--line:#e4e0d2;
  --pending:#b7b3a3;--queued:#C9A227;--running:#2f7ad6;--done:#1B7A43;--gate:#9A4DBB;--blocked:#B3261E;}
*{box-sizing:border-box;margin:0}body{font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#F3EFE4}
header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:10px}
header .star{color:var(--gold);font-size:20px}header h1{font-size:18px;font-weight:600}
header .book{margin-left:auto;font-size:13px;opacity:.85}
.wrap{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;padding:18px;max-width:1180px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:12px}
.stage{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1eee2}
.stage:last-child{border-bottom:none}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.stage .nm{font-weight:500;font-size:14px}.stage .ag{font-size:12px;color:var(--muted)}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;text-transform:capitalize}
.spacer{flex:1}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:#faf7ee}button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
button.gate{background:var(--gate);color:#fff;border-color:var(--gate)}
.controls{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;font-size:13px}
.toggle{margin-left:auto}
.chat{display:flex;flex-direction:column;height:340px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.msg{max-width:88%;padding:8px 11px;border-radius:12px;font-size:13px;line-height:1.4}
.msg.user{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:3px}
.msg.assistant{align-self:flex-start;background:#F1EEE2;color:var(--navy);border-bottom-left-radius:3px}
.chatbar{display:flex;gap:8px;margin-top:10px}.chatbar input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
.jobs{font-size:12px;color:var(--muted);max-height:150px;overflow:auto}
.jobline{padding:4px 0;border-bottom:1px dashed #eee7d6}
.budget{height:6px;background:#eee7d6;border-radius:4px;overflow:hidden}.budget>span{display:block;height:100%;background:var(--gold)}
select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:8px}
small.hint{color:var(--muted);font-size:11px}
.preview-wrap{max-width:1180px;margin:0 auto;padding:0 18px 28px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.thumb{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.thumb img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#efe9da}
.thumb .cap{font-size:11px;color:var(--muted);padding:4px 7px;display:flex;justify-content:space-between;gap:4px;align-items:center}
.thumb .cap .am{font-family:'Noto Sans Ethiopic',serif;font-weight:700;color:var(--navy)}
.thumb{cursor:pointer;transition:transform .12s}.thumb:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(34,43,109,.14)}
.modal{position:fixed;inset:0;background:rgba(20,22,40,.62);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
.modal.open{display:flex}
.modal-card{background:#fff;border-radius:14px;overflow:hidden;display:flex;max-width:1000px;width:100%;max-height:90vh}
.modal-card>img{width:58%;object-fit:contain;background:#11142a}
.modal-side{flex:1;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.modal-title{font-weight:600;font-size:18px}.modal-sub{color:var(--muted);font-size:13px}
.modal-side textarea{flex:1;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
.modal-actions{display:flex;gap:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.spin{display:inline-block;animation:spin 1.1s linear infinite}
.proc{position:absolute;inset:0;background:rgba(255,253,247,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--navy);font-size:11px;font-weight:600}
.proc .star{color:var(--gold);font-size:28px}
#working{display:none;align-items:center;gap:6px;font-size:13px;color:#FBE9B0;animation:pulse 1.6s ease-in-out infinite}
#working.on{display:inline-flex}
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@700&display=swap" rel="stylesheet"></head><body>
<header><span class="star">★</span><h1>Kokeba Studio</h1><span class="book" id="bookname">—</span><span id="working" style="margin-left:12px"><span class="spin">★</span> working…</span></header>
<div class="wrap">
  <div class="card">
    <h2>Production pipeline</h2>
    <div id="stages"></div>
    <h2 style="margin-top:16px">Recent jobs</h2>
    <div class="jobs" id="jobs"></div>
  </div>
  <div>
    <div class="card" style="margin-bottom:18px">
      <h2>Controls</h2>
      <div class="controls">
        <div class="row">Approval mode
          <select id="mode" class="toggle" onchange="setMode(this.value)">
            <option value="copilot">copilot (run each stage)</option>
            <option value="autopilot">autopilot (auto-advance)</option>
          </select></div>
        <div class="row">Kill switch
          <button id="kill" class="toggle" onclick="toggleKill()">—</button></div>
        <div class="row" style="display:block">Daily budget <span id="budgettxt" style="float:right;color:var(--muted)"></span>
          <div class="budget" style="margin-top:6px"><span id="budgetbar"></span></div></div>
        <small class="hint">Autopilot auto-runs stages; gates always wait for you.</small>
      </div>
    </div>
    <div class="card">
      <h2>Feedback chat</h2>
      <div class="chat">
        <div class="msgs" id="msgs"></div>
        <div class="chatbar">
          <input id="chatin" placeholder='e.g. "regenerate s05, monkey too close"' onkeydown="if(event.key==='Enter')send()">
          <button class="primary" onclick="send()">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="preview-wrap"><div class="card">
  <h2>Book preview — always-on proof <button onclick="bumpArt()" style="float:right;font-size:11px;padding:3px 9px">↻ refresh art</button></h2>
  <div id="preview" class="thumbs"></div>
</div></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeImg()">
  <div class="modal-card">
    <img id="modal-img" src="" alt="">
    <div class="modal-side">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-sub" id="modal-sub"></div>
      <textarea id="modal-fb" placeholder="Feedback for THIS page — e.g. 'make the lion friendlier', 'don't cover Mama's face', 'she should face the entrance'"></textarea>
      <div class="modal-actions">
        <button class="primary" onclick="regenFromModal()">Regenerate this page</button>
        <button onclick="closeImg()">Close</button>
      </div>
      <small class="hint" id="modal-note"></small>
    </div>
  </div>
</div>
<script>
const API="";let BOOK=null;let PAGES=null,ART_V=1,PREV_ILLUS=0,MODAL_SCENE=null,PROCESSING=new Set(),RENDER_KEY='';
const C={pending:'--pending',queued:'--queued',running:'--running',needs_approval:'--gate',done:'--done',blocked:'--blocked'};
const api=(p,m,b)=>fetch(API+p,{method:m||'GET',headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined}).then(r=>r.json());
async function refresh(){
  const s=await api('/api/state');BOOK=s.books[0];
  const di=s.jobs.filter(j=>j.stage==='illustration'&&j.status==='done').length;if(di>PREV_ILLUS){PREV_ILLUS=di;ART_V++;}
  PROCESSING=new Set(s.jobs.filter(j=>j.stage==='illustration'&&(j.status==='queued'||j.status==='running')).map(j=>j.scope).filter(Boolean));
  const active=s.jobs.filter(j=>j.status==='queued'||j.status==='running').length;document.getElementById('working').classList.toggle('on',active>0);
  document.getElementById('bookname').textContent=BOOK.title+" · "+BOOK.country+" · "+BOOK.age;
  document.getElementById('mode').value=s.controls.approval_mode;
  const k=document.getElementById('kill');k.textContent=s.controls.kill_switch==='on'?'ON — paused':'off';
  k.style.background=s.controls.kill_switch==='on'?'#B3261E':'#fff';k.style.color=s.controls.kill_switch==='on'?'#fff':'#222B6D';
  const b=s.controls.budget;document.getElementById('budgettxt').textContent=`$${b.spent_today_usd} / $${b.daily_cap_usd}`;
  document.getElementById('budgetbar').style.width=Math.min(100,100*b.spent_today_usd/b.daily_cap_usd)+'%';
  document.getElementById('stages').innerHTML=s.stages.map(st=>{
    const status=BOOK.stages[st.id]||'pending';const col=`var(${C[status]})`;
    let action='';
    if(status==='needs_approval')action=`<button class="gate" onclick="approve('${st.id}')">Approve</button>`;
    else if(status==='running'||status==='queued')action=`<button disabled><span class="spin" style="color:var(--gold)">★</span></button>`;
    else action=`<button onclick="run('${st.id}')">${status==='done'?'Re-run':'Run'}</button>`;
    return `<div class="stage"><span class="dot" style="background:${col}"></span>
      <div><div class="nm">${st.label}</div><div class="ag">${st.agent}${st.gate?' · gate':''}</div></div>
      <span class="spacer"></span>
      <span class="badge" style="background:${col}22;color:${col}">${status.replace('_',' ')}</span>${action}</div>`;
  }).join('');
  document.getElementById('jobs').innerHTML=s.jobs.map(j=>`<div class="jobline">[${j.status}] ${j.stage}${j.scope?' · '+j.scope:''} ${j.logs&&j.logs.length?'— '+j.logs.join('; '):''}</div>`).join('')||'<div class="jobline">no jobs yet</div>';
  const chat=(await api('/api/books/'+BOOK.id)).chat||[];
  document.getElementById('msgs').innerHTML=chat.map(m=>`<div class="msg ${m.role}">${m.text}</div>`).join('');
  const mm=document.getElementById('msgs');mm.scrollTop=mm.scrollHeight;
  await maybeRenderPreview();
}
async function maybeRenderPreview(){
  if(!BOOK)return;
  if(!PAGES){const r=await api('/api/books/'+BOOK.id+'/pages');PAGES=(r&&r.pages)||[];}
  const key=ART_V+'|'+[...PROCESSING].sort().join(',');
  if(RENDER_KEY!==key){RENDER_KEY=key;renderPreview();}
}
function renderPreview(){
  const el=document.getElementById('preview');if(!el||!PAGES)return;
  const imgs=PAGES.filter(p=>p.image);
  el.innerHTML=imgs.length?imgs.map(p=>{const sc=p.image.replace(/\.png$/,'');const proc=PROCESSING.has(sc);
    return `<div class="thumb" onclick="openImg('${p.image}','${p.page}',${p.vocab?`'${p.vocab.am}'`:'null'})"><img src="/api/art/${BOOK.id}/${p.image}?v=${ART_V}" alt="">${proc?'<div class="proc"><span class="star spin">★</span>Regenerating…</div>':''}<div class="cap"><span>${p.page}</span>${p.vocab?`<span class="am">${p.vocab.am}</span>`:''}</div></div>`;}).join(''):'<div class="jobline">no art generated yet</div>';
}
function bumpArt(){ART_V++;RENDER_KEY='';renderPreview();}
function openImg(image,page,am){
  MODAL_SCENE=image.replace(/\.png$/,'');
  document.getElementById('modal-img').src='/api/art/'+BOOK.id+'/'+image+'?v='+ART_V;
  document.getElementById('modal-title').textContent='Page '+page+(am&&am!=='null'?' · '+am:'');
  document.getElementById('modal-sub').textContent=image+' — inspect & give feedback';
  document.getElementById('modal-fb').value='';document.getElementById('modal-note').textContent='';
  document.getElementById('modal').classList.add('open');
}
function closeImg(){document.getElementById('modal').classList.remove('open');}
async function regenFromModal(){
  const note=document.getElementById('modal-fb').value.trim();
  PROCESSING.add(MODAL_SCENE);RENDER_KEY='';renderPreview();
  document.getElementById('modal-note').innerHTML='<span class="spin" style="color:var(--gold)">★</span> Queued regeneration of '+MODAL_SCENE+'… it updates here when the worker finishes.';
  await api('/api/jobs','POST',{bookId:BOOK.id,stage:'illustration',scope:MODAL_SCENE,note:note||('regenerate '+MODAL_SCENE)});
  refresh();
}
const run=(stage)=>api('/api/jobs','POST',{bookId:BOOK.id,stage}).then(refresh);
const approve=(stage)=>api('/api/books/'+BOOK.id+'/approve','POST',{stage}).then(refresh);
const setMode=(v)=>api('/api/controls','POST',{approval_mode:v}).then(refresh);
const toggleKill=async()=>{const s=await api('/api/state');api('/api/controls','POST',{kill_switch:s.controls.kill_switch==='on'?'off':'on'}).then(refresh);};
async function send(){const i=document.getElementById('chatin');const t=i.value.trim();if(!t)return;i.value='';await api('/api/chat','POST',{bookId:BOOK.id,text:t});refresh();}
refresh();setInterval(refresh,1500);
</script></body></html>
